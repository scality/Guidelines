---
name: tests

on:
  push:
    branches-ignore:
    - 'development/**'

jobs:
  test:
    strategy:
      matrix:
        node-version:
          - '16'
          - '22'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: install dependencies
      run: yarn install --frozen-lockfile
    - name: lint markdown
      run: yarn lint_md
    - name: lint javascript
      run: yarn lint
